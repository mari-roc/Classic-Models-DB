services:
  db:
    image: postgres:17
    container_name: classic-models-db
    environment:
      POSTGRES_DB: classic_models
      POSTGRES_USER: classic_models
      POSTGRES_PASSWORD: env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
